name: Lambergar Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Lambergar Android ARM64 NEON
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # BASIC DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            xz-utils \
            python3 \
            file \
            binutils

      # ============================================================
      # ZIG
      # ============================================================
      - name: Install Zig 0.15.1
        run: |
          ZIG_VERSION="0.15.1"
          ZIG_ARCHIVE="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_ARCHIVE}"

          curl -L "$ZIG_URL" -o "$ZIG_ARCHIVE"

          tar -xf "$ZIG_ARCHIVE"

          ZIG_DIR="$PWD/zig-x86_64-linux-${ZIG_VERSION}"

          echo "$ZIG_DIR" >> "$GITHUB_PATH"

          echo "===== ZIG VERSION ====="
          "$ZIG_DIR/zig" version

      # ============================================================
      # SOURCE TREE
      # ============================================================
      - name: Show source tree
        run: |
          echo "===== ZIG SOURCE FILES ====="
          find src -type f -name "*.zig" -print | sort

      # ============================================================
      # REPAIR BROKEN ZIG STRING LITERALS
      # ============================================================
      - name: Repair broken Zig string literals
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("src")
          files = list(root.rglob("*.zig"))

          if not files:
              raise SystemExit("ERROR: No Zig source files found.")

          total = 0

          for path in files:
              text = path.read_text()

              result = []
              in_string = False
              escaped = False
              changed = False

              i = 0

              while i < len(text):
                  ch = text[i]

                  # Preserve Zig multiline strings.
                  if not in_string and text.startswith('\\\\(', i):
                      j = text.find('\\\\)', i + 3)

                      if j != -1:
                          block = text[i:j + 3]
                          result.append(block)
                          i = j + 3
                          continue

                  if ch == '"' and not escaped:
                      in_string = not in_string
                      result.append(ch)
                      escaped = False
                      i += 1
                      continue

                  if ch == '\n' and in_string:
                      result.append('\\n')
                      changed = True
                      i += 1
                      continue

                  result.append(ch)

                  if ch == '\\' and not escaped:
                      escaped = True
                  else:
                      escaped = False

                  i += 1

              fixed = ''.join(result)

              if changed:
                  path.write_text(fixed)
                  total += 1
                  print(f"REPAIRED: {path}")

          print()
          print(f"Files repaired: {total}")
          PY

      # ============================================================
      # CHECK STRING REPAIR
      # ============================================================
      - name: Check for remaining broken strings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          errors = []

          for path in Path("src").rglob("*.zig"):
              text = path.read_text()

              in_string = False
              escaped = False

              for line_no, line in enumerate(text.splitlines(True), 1):
                  for ch in line:
                      if ch == '"' and not escaped:
                          in_string = not in_string

                      if ch == '\\' and not escaped:
                          escaped = True
                      else:
                          escaped = False

                  if in_string:
                      errors.append((path, line_no))

          if errors:
              print("ERROR: Possible broken multiline string literals remain:")

              for path, line in errors:
                  print(f"  {path}:{line}")

              raise SystemExit(1)

          print("OK: No broken multiline Zig string literals detected.")
          PY

      # ============================================================
      # FORMAT
      # ============================================================
      - name: Format Zig source
        run: |
          zig fmt src

      - name: Check Zig formatting
        run: |
          zig fmt --check src

      # ============================================================
      # USE GITHUB RUNNER'S PREINSTALLED ANDROID SDK
      # ============================================================
      - name: Locate Android SDK
        run: |
          echo "===== ANDROID ENVIRONMENT ====="

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          SDK=""

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          fi

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "Using Android SDK:"
          echo "$SDK"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # ============================================================
      # FIND SDKMANAGER
      # ============================================================
      - name: Locate sdkmanager
        run: |
          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."

            echo
            echo "SDK contents:"
            find "$SDK" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "===== SDKMANAGER ====="
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

      # ============================================================
      # ACCEPT LICENSES
      # ============================================================
      - name: Accept Android licenses
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      # ============================================================
      # INSTALL ANDROID NDK
      # ============================================================
      - name: Install Android NDK
        run: |
          echo "Installing Android NDK 27.2.12479018..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      # ============================================================
      # VERIFY NDK
      # ============================================================
      - name: Configure Android NDK
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Android NDK not found:"
            echo "$NDK"

            echo
            echo "Installed NDKs:"
            find "$ANDROID_SDK_ROOT/ndk" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

          if [ ! -x "$CLANG" ]; then
            echo "ERROR: AArch64 Android compiler not found:"
            echo "$CLANG"
            exit 1
          fi

          echo "===== NDK ====="
          echo "$NDK"

          echo
          echo "===== AARCH64 CLANG ====="
          "$CLANG" --version

      # ============================================================
      # BUILD LAMBERGAR
      # ============================================================
      - name: Build Lambergar Android ARM64
        run: |
          echo "===== ZIG VERSION ====="
          zig version

          echo
          echo "===== ANDROID TARGETS ====="
          zig targets | grep -A5 -B5 android || true

          echo
          echo "===== BUILD ====="

          zig build \
            -Dtarget=aarch64-linux-android.24 \
            -Doptimize=ReleaseFast

      # ============================================================
      # LOCATE OUTPUT
      # ============================================================
      - name: Locate binary
        run: |
          echo "===== BUILD OUTPUT ====="

          if [ ! -d zig-out ]; then
            echo "ERROR: zig-out directory does not exist."
            exit 1
          fi

          find zig-out -type f -exec ls -lh {} \;

      # ============================================================
      # VERIFY ARM64
      # ============================================================
      - name: Verify Android ARM64 binary
        run: |
          BIN="$(find zig-out/bin -type f -executable | head -n 1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: No executable found in zig-out/bin."
            exit 1
          fi

          echo "===== BINARY ====="
          echo "$BIN"

          echo
          echo "===== FILE ====="
          file "$BIN"

          echo
          echo "===== ELF HEADER ====="
          readelf -h "$BIN" | grep -E \
            "Class:|Data:|Type:|OS/ABI:|Machine:"

          echo
          echo "===== ARCHITECTURE CHECK ====="

          if file "$BIN" | grep -qi "ARM aarch64"; then
            echo "OK: AArch64 ARM64 binary."
          else
            echo "ERROR: Binary is not AArch64."
            exit 1
          fi

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare release artifact
        run: |
          mkdir -p release

          BIN="$(find zig-out/bin -type f -executable | head -n 1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: Could not locate executable."
            exit 1
          fi

          cp "$BIN" release/lambergar-android-arm64

          chmod +x release/lambergar-android-arm64

          echo "===== FINAL ARTIFACT ====="
          ls -lh release/lambergar-android-arm64

          file release/lambergar-android-arm64

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload Android ARM64 NEON binary
        uses: actions/upload-artifact@v4
        with:
          name: lambergar-android-arm64-neon
          path: release/lambergar-android-arm64

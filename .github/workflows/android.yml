name: Lambergar Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Lambergar Android ARM64 NEON
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            xz-utils \
            python3 \
            file \
            binutils

      - name: Install Zig 0.15.1
        run: |
          ZIG_VERSION="0.15.1"
          ZIG_ARCHIVE="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_ARCHIVE}"

          curl -L "$ZIG_URL" -o "$ZIG_ARCHIVE"
          tar -xf "$ZIG_ARCHIVE"

          ZIG_DIR="$PWD/zig-x86_64-linux-${ZIG_VERSION}"

          echo "$ZIG_DIR" >> "$GITHUB_PATH"

          "$ZIG_DIR/zig" version

      - name: Show source tree
        run: |
          echo "===== SOURCE FILES ====="
          find src -maxdepth 1 -type f -name "*.zig" | sort

      - name: Repair NNUE debug strings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/nnue.zig")
          text = path.read_text()

          start = text.find("pub fn print_debug_stats")

          if start == -1:
              print("print_debug_stats() not found; no repair needed.")
              raise SystemExit(0)

          # Locate the end of the function.
          brace_start = text.find("{", start)

          if brace_start == -1:
              raise SystemExit("Could not locate print_debug_stats() opening brace.")

          depth = 0
          end = None

          for i in range(brace_start, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit("Could not locate print_debug_stats() closing brace.")

          section = text[start:end]

          # Convert literal newlines occurring inside quoted Zig strings
          # into the valid two-character escape sequence \n.
          result = []
          in_string = False
          escaped = False

          for ch in section:
              if ch == '"' and not escaped:
                  in_string = not in_string
                  result.append(ch)
                  continue

              if ch == '\n' and in_string:
                  result.append('\\n')
                  continue

              result.append(ch)

              if ch == '\\' and not escaped:
                  escaped = True
              else:
                  escaped = False

          fixed = ''.join(result)

          text = text[:start] + fixed + text[end:]
          path.write_text(text)

          print("NNUE debug strings repaired.")
          PY

      - name: Show repaired NNUE section
        run: |
          echo "===== print_debug_stats() ====="
          sed -n '/pub fn print_debug_stats/,/^}/p' src/nnue.zig

      - name: Format Zig source
        run: |
          zig fmt src/*.zig

      - name: Check Zig source
        run: |
          zig fmt --check src/*.zig

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          if [ ! -d "$NDK" ]; then
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Android NDK not found."
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "NDK:"
          echo "$NDK"

          echo "AArch64 compiler:"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            --version

      - name: Build Lambergar Android ARM64
        run: |
          echo "===== ZIG VERSION ====="
          zig version

          echo "===== BUILD TARGET ====="
          zig targets | grep -A3 -B3 android || true

          echo "===== BUILD ====="

          zig build \
            -Dtarget=aarch64-linux-android.24 \
            -Doptimize=ReleaseFast

      - name: Locate binary
        run: |
          echo "===== BUILD OUTPUT ====="

          if [ ! -d zig-out ]; then
            echo "ERROR: zig-out directory does not exist."
            exit 1
          fi

          find zig-out -type f -exec ls -lh {} \;

      - name: Verify Android ARM64 binary
        run: |
          BIN="$(find zig-out/bin -type f -executable | head -n 1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: No executable found in zig-out/bin."
            exit 1
          fi

          echo "===== BINARY ====="
          echo "$BIN"

          echo "===== FILE ====="
          file "$BIN"

          echo "===== ELF HEADER ====="
          readelf -h "$BIN" | grep -E \
            "Class:|Data:|Type:|OS/ABI:|Machine:"

          echo "===== MACHINE CHECK ====="

          if file "$BIN" | grep -qi "ARM aarch64"; then
            echo "OK: AArch64 ARM64 binary."
          else
            echo "ERROR: Binary is not identified as AArch64."
            exit 1
          fi

      - name: Prepare release artifact
        run: |
          mkdir -p release

          BIN="$(find zig-out/bin -type f -executable | head -n 1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: Could not locate executable."
            exit 1
          fi

          cp "$BIN" release/lambergar-android-arm64
          chmod +x release/lambergar-android-arm64

          echo "===== FINAL ARTIFACT ====="
          ls -lh release/lambergar-android-arm64

          file release/lambergar-android-arm64

      - name: Upload Android ARM64 NEON binary
        uses: actions/upload-artifact@v4
        with:
          name: lambergar-android-arm64-neon
          path: release/lambergar-android-arm64

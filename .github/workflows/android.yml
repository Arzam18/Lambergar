name: Lambergar Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Lambergar Android ARM64 NEON
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            xz-utils \
            python3 \
            file \
            binutils

      - name: Install Zig 0.15.1
        run: |
          ZIG_VERSION="0.15.1"
          ZIG_ARCHIVE="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_ARCHIVE}"

          curl -L "$ZIG_URL" -o "$ZIG_ARCHIVE"
          tar -xf "$ZIG_ARCHIVE"

          ZIG_DIR="$PWD/zig-x86_64-linux-${ZIG_VERSION}"

          echo "$ZIG_DIR" >> "$GITHUB_PATH"

          "$ZIG_DIR/zig" version

      - name: Show source tree
        run: |
          echo "===== ZIG SOURCE FILES ====="
          find src -type f -name "*.zig" -print | sort

      # ============================================================
      # REPAIR BROKEN MULTILINE ZIG STRING LITERALS
      # ============================================================
      - name: Repair broken Zig string literals
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("src")

          files = list(root.rglob("*.zig"))

          if not files:
              raise SystemExit("ERROR: No Zig source files found.")

          total = 0

          for path in files:
              text = path.read_text()

              result = []
              in_string = False
              escaped = False
              changed = False

              i = 0

              while i < len(text):
                  ch = text[i]

                  # Zig multiline strings use \\( ... ) syntax.
                  # Do not touch those.
                  if not in_string and text.startswith('\\\\(', i):
                      j = text.find('\\\\)', i + 3)

                      if j != -1:
                          block = text[i:j + 3]
                          result.append(block)
                          i = j + 3
                          continue

                  if ch == '"' and not escaped:
                      in_string = not in_string
                      result.append(ch)
                      escaped = False
                      i += 1
                      continue

                  if ch == '\n' and in_string:
                      result.append('\\n')
                      changed = True
                      i += 1
                      continue

                  result.append(ch)

                  if ch == '\\' and not escaped:
                      escaped = True
                  else:
                      escaped = False

                  i += 1

              fixed = ''.join(result)

              if changed:
                  path.write_text(fixed)
                  total += 1
                  print(f"REPAIRED: {path}")

          print()
          print(f"Files repaired: {total}")
          PY

      - name: Check for remaining broken strings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          errors = []

          for path in Path("src").rglob("*.zig"):
              text = path.read_text()

              in_string = False
              escaped = False

              for line_no, line in enumerate(text.splitlines(True), 1):
                  for ch in line:
                      if ch == '"' and not escaped:
                          in_string = not in_string

                      if ch == '\\' and not escaped:
                          escaped = True
                      else:
                          escaped = False

                  # A normal Zig string must not continue onto another
                  # physical source line.
                  if in_string:
                      errors.append((path, line_no))

          if errors:
              print("ERROR: Possible broken multiline string literals remain:")

              for path, line in errors:
                  print(f"  {path}:{line}")

              raise SystemExit(1)

          print("OK: No broken multiline Zig string literals detected.")
          PY

      - name: Show repaired NNUE debug section
        run: |
          echo "===== NNUE DEBUG FUNCTIONS ====="

          grep -n -A120 \
            "pub fn print_debug_stats" \
            src/nnue.zig || true

      - name: Format Zig source
        run: |
          zig fmt src

      - name: Check Zig formatting
        run: |
          zig fmt --check src

      # ============================================================
      # ANDROID
      # ============================================================
      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -name sdkmanager \
              -type f \
              | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          if [ ! -d "$NDK" ] && [ -n "$ANDROID_HOME" ]; then
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Android NDK 27.2.12479018 not found."
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "===== NDK ====="
          echo "$NDK"

          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

          if [ ! -x "$CLANG" ]; then
            echo "ERROR: Android AArch64 compiler not found:"
            echo "$CLANG"
            exit 1
          fi

          "$CLANG" --version

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Lambergar Android ARM64
        run: |
          echo "===== ZIG VERSION ====="
          zig version

          echo
          echo "===== ANDROID TARGETS ====="
          zig targets | grep -A5 -B5 android || true

          echo
          echo "===== BUILDING ====="

          zig build \
            -Dtarget=aarch64-linux-android.24 \
            -Doptimize=ReleaseFast

      # ============================================================
      # VERIFY
      # ============================================================
      - name: Locate binary
        run: |
          echo "===== BUILD OUTPUT ====="

          if [ ! -d zig-out ]; then
            echo "ERROR: zig-out directory does not exist."
            exit 1
          fi

          find zig-out -type f -exec ls -lh {} \;

      - name: Verify Android ARM64 binary
        run: |
          BIN="$(find zig-out/bin -type f -executable | head -n 1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: No executable found in zig-out/bin."
            exit 1
          fi

          echo "===== BINARY ====="
          echo "$BIN"

          echo
          echo "===== FILE ====="
          file "$BIN"

          echo
          echo "===== ELF HEADER ====="
          readelf -h "$BIN" | grep -E \
            "Class:|Data:|Type:|OS/ABI:|Machine:"

          echo
          echo "===== ARCHITECTURE CHECK ====="

          if file "$BIN" | grep -qi "ARM aarch64"; then
            echo "OK: AArch64 ARM64 binary."
          else
            echo "ERROR: Binary is not AArch64."
            exit 1
          fi

      - name: Prepare release artifact
        run: |
          mkdir -p release

          BIN="$(find zig-out/bin -type f -executable | head -n 1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: Could not locate executable."
            exit 1
          fi

          cp "$BIN" release/lambergar-android-arm64
          chmod +x release/lambergar-android-arm64

          echo "===== FINAL ARTIFACT ====="
          ls -lh release/lambergar-android-arm64

          file release/lambergar-android-arm64

      - name: Upload Android ARM64 NEON binary
        uses: actions/upload-artifact@v4
        with:
          name: lambergar-android-arm64-neon
          path: release/lambergar-android-arm64

name: Lambergar Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Lambergar Android ARM64 NEON
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            xz-utils \
            python3 \
            file \
            binutils

      # ============================================================
      # ZIG 0.15.1
      # ============================================================
      - name: Install Zig 0.15.1
        run: |
          ZIG_VERSION="0.15.1"
          ARCHIVE="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          URL="https://ziglang.org/download/${ZIG_VERSION}/${ARCHIVE}"

          curl -L "$URL" -o "$ARCHIVE"
          tar -xf "$ARCHIVE"

          ZIG_DIR="$PWD/zig-x86_64-linux-${ZIG_VERSION}"

          echo "$ZIG_DIR" >> "$GITHUB_PATH"

          echo "===== ZIG VERSION ====="
          "$ZIG_DIR/zig" version

      # ============================================================
      # SHOW SOURCE
      # ============================================================
      - name: Show source tree
        run: |
          echo "===== ZIG SOURCE FILES ====="
          find src -type f -name "*.zig" -print | sort

      # ============================================================
      # REPAIR BROKEN ZIG STRING LITERALS
      # ============================================================
      - name: Repair broken Zig string literals
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in Path("src").rglob("*.zig"):
              text = path.read_text()

              result = []
              in_string = False
              escaped = False
              changed = False

              i = 0

              while i < len(text):
                  ch = text[i]

                  if ch == '"' and not escaped:
                      in_string = not in_string
                      result.append(ch)
                      escaped = False
                      i += 1
                      continue

                  if ch == '\n' and in_string:
                      result.append('\\n')
                      changed = True
                      i += 1
                      continue

                  result.append(ch)

                  if ch == '\\' and not escaped:
                      escaped = True
                  else:
                      escaped = False

                  i += 1

              fixed = ''.join(result)

              if changed:
                  path.write_text(fixed)
                  print(f"REPAIRED: {path}")

          print("String repair complete.")
          PY

      # ============================================================
      # FIX NEON VECTOR LANE EXTRACTION
      #
      # Zig @Vector cannot be sliced with:
      #
      #     vector[0..8].*
      #
      # Replace those operations with @shuffle().
      # ============================================================
      - name: Fix NEON vector lane extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/nnue.zig")
          text = path.read_text()

          replacements = [
              (
                  "const p0_lo: VecI32 = @intCast(p0[0..8].*);",
                  """const p0_lo: VecI32 = @intCast(@shuffle(
              i16,
              p0,
              p0,
              [8]i32{ 0, 1, 2, 3, 4, 5, 6, 7 },
          ));"""
              ),

              (
                  "const p0_hi: VecI32 = @intCast(p0[8..16].*);",
                  """const p0_hi: VecI32 = @intCast(@shuffle(
              i16,
              p0,
              p0,
              [8]i32{ 8, 9, 10, 11, 12, 13, 14, 15 },
          ));"""
              ),

              (
                  "const p1_lo: VecI32 = @intCast(p1[0..8].*);",
                  """const p1_lo: VecI32 = @intCast(@shuffle(
              i16,
              p1,
              p1,
              [8]i32{ 0, 1, 2, 3, 4, 5, 6, 7 },
          ));"""
              ),

              (
                  "const p1_hi: VecI32 = @intCast(p1[8..16].*);",
                  """const p1_hi: VecI32 = @intCast(@shuffle(
              i16,
              p1,
              p1,
              [8]i32{ 8, 9, 10, 11, 12, 13, 14, 15 },
          ));"""
              ),

              (
                  "const product_lo: VecI32 = @intCast(product[0..8].*);",
                  """const product_lo: VecI32 = @intCast(@shuffle(
              i16,
              product,
              product,
              [8]i32{ 0, 1, 2, 3, 4, 5, 6, 7 },
          ));"""
              ),

              (
                  "const product_hi: VecI32 = @intCast(product[8..16].*);",
                  """const product_hi: VecI32 = @intCast(@shuffle(
              i16,
              product,
              product,
              [8]i32{ 8, 9, 10, 11, 12, 13, 14, 15 },
          ));"""
              ),
          ]

          fixed = 0

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  fixed += 1
                  print("FIXED:", old)
              else:
                  print("NOT FOUND:", old)

          path.write_text(text)

          print()
          print(f"Fixed {fixed}/6 vector expressions.")

          if fixed != 6:
              raise SystemExit("ERROR: Expected to fix all 6 vector expressions.")
          PY

      # ============================================================
      # VERIFY VECTOR FIX
      # ============================================================
      - name: Verify vector fix
        run: |
          echo "===== CHECKING VECTOR SLICES ====="

          if grep -nE \
            '@intCast\((p0|p1|product)\[[0-9]+\.\.[0-9]+\]\.\*\)' \
            src/nnue.zig; then

            echo "ERROR: Invalid vector slicing remains."
            exit 1
          fi

          echo "OK: No invalid vector slices remain."

      # ============================================================
      # FORMAT
      # ============================================================
      - name: Format Zig source
        run: |
          zig fmt src

      - name: Check Zig formatting
        run: |
          zig fmt --check src

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Locate Android SDK
        run: |
          SDK=""

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && \
             [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"

          elif [ -n "${ANDROID_HOME:-}" ] && \
               [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          fi

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Using Android SDK:"
          echo "$SDK"

      # ============================================================
      # SDKMANAGER
      # ============================================================
      - name: Locate sdkmanager
        run: |
          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null \
              | sort -V \
              | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "===== SDKMANAGER ====="
          "$SDKMANAGER" --version

      # ============================================================
      # ANDROID LICENSES
      # ============================================================
      - name: Accept Android licenses
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      # ============================================================
      # INSTALL NDK
      # ============================================================
      - name: Install Android NDK
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      # ============================================================
      # CONFIGURE NDK
      # ============================================================
      - name: Configure Android NDK
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          CLANG="$TOOLCHAIN/bin/aarch64-linux-android24-clang"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK not found:"
            echo "$NDK"
            exit 1
          fi

          if [ ! -x "$CLANG" ]; then
            echo "ERROR: Android ARM64 compiler not found:"
            echo "$CLANG"
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_SYSROOT=$SYSROOT" >> "$GITHUB_ENV"

          echo "===== NDK ====="
          echo "$NDK"

          echo
          echo "===== CLANG ====="
          "$CLANG" --version

      # ============================================================
      # ANDROID LIBC CONFIGURATION FOR ZIG
      # ============================================================
      - name: Create Android libc configuration
        run: |
          SYSROOT="$ANDROID_SYSROOT"

          CRT_DIR="$SYSROOT/usr/lib/aarch64-linux-android/24"
          ARCH_INCLUDE="$SYSROOT/usr/include/aarch64-linux-android"

          if [ ! -d "$CRT_DIR" ]; then
            echo "ERROR: CRT directory missing:"
            echo "$CRT_DIR"
            exit 1
          fi

          if [ ! -d "$ARCH_INCLUDE" ]; then
            echo "ERROR: Android architecture include directory missing:"
            echo "$ARCH_INCLUDE"
            exit 1
          fi

          cat > android-libc.conf <<EOF
          include_dir=$SYSROOT/usr/include
          sys_include_dir=$ARCH_INCLUDE
          crt_dir=$CRT_DIR
          msvc_lib_dir=
          kernel32_lib_dir=
          gcc_dir=
          EOF

          echo "===== ANDROID LIBC CONFIG ====="
          cat android-libc.conf

      # ============================================================
      # VERIFY LIBC
      # ============================================================
      - name: Verify Android libc
        run: |
          SYSROOT="$ANDROID_SYSROOT"
          CRT_DIR="$SYSROOT/usr/lib/aarch64-linux-android/24"

          echo "===== SYSROOT ====="
          ls -ld "$SYSROOT"

          echo
          echo "===== ARCH INCLUDE ====="
          ls -ld "$SYSROOT/usr/include/aarch64-linux-android"

          echo
          echo "===== CRT ====="
          ls -lh "$CRT_DIR" | head -30

          if [ ! -e "$CRT_DIR/libc.so" ] && \
             [ ! -e "$CRT_DIR/libc.a" ]; then
            echo "ERROR: Android libc not found."
            exit 1
          fi

          echo "OK: Android libc found."

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Lambergar Android ARM64
        run: |
          echo "===== ZIG ====="
          zig version

          echo
          echo "===== BUILD ====="

          zig build \
            -Dtarget=aarch64-linux-android.24 \
            --libc android-libc.conf

      # ============================================================
      # SHOW OUTPUT
      # ============================================================
      - name: Show build output
        run: |
          echo "===== ZIG-OUT ====="

          find zig-out \
            -type f \
            -exec ls -lh {} \;

      # ============================================================
      # VERIFY ARM64
      # ============================================================
      - name: Verify ARM64 executable
        run: |
          BIN="$(find zig-out/bin \
            -type f \
            -executable \
            | grep -v 'bin_to_binhce' \
            | head -n 1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: Lambergar executable not found."
            exit 1
          fi

          echo "Binary:"
          echo "$BIN"

          echo
          echo "===== FILE ====="
          file "$BIN"

          echo
          echo "===== ELF ====="
          readelf -h "$BIN" | grep -E \
            "Class:|Data:|Type:|OS/ABI:|Machine:"

          if ! file "$BIN" | grep -qi "ARM aarch64"; then
            echo "ERROR: Binary is not AArch64."
            exit 1
          fi

          echo
          echo "OK: Android ARM64 binary."

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare release artifact
        run: |
          mkdir -p release

          BIN="$(find zig-out/bin \
            -type f \
            -executable \
            | grep -v 'bin_to_binhce' \
            | head -n 1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: Binary not found."
            exit 1
          fi

          cp "$BIN" release/lambergar-android-arm64
          chmod +x release/lambergar-android-arm64

          echo "===== FINAL FILE ====="
          ls -lh release/lambergar-android-arm64

          file release/lambergar-android-arm64

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload Android ARM64 NEON binary
        uses: actions/upload-artifact@v4
        with:
          name: lambergar-android-arm64-neon
          path: release/lambergar-android-arm64
